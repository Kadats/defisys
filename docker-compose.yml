services:
  postgres:
    image: postgres:15-alpine
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      POSTGRES_DB: defisys
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres_data/producao:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d defisys"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: defisys_test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres_data/teste:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d defisys_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_paper:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: defisys_paper_trading
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres_data/paper:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d defisys_paper_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/defisys
      - TEST_DATABASE_URL=postgresql://user:password@postgres_test:5432/defisys_test
      - PAPER_DATABASE_URL=postgresql://user:password@postgres_paper:5432/defisys_paper_trading
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_BACKTEST_DAYS=30
      - GEMINI_API_DELAY_SECONDS=5.0  # Delay between API calls (15 RPM limit = 4s min, using 5s for safety)
      - GROK_API_KEY=${GROK_API_KEY}
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - backend_logs:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
      postgres_paper:
        condition: service_healthy
    restart: always
    command: ["python", "-m", "uvicorn", "backend.src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/system/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_test:5432/defisys_test
      - TEST_DATABASE_URL=postgresql://user:password@postgres_test:5432/defisys_test
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GROK_API_KEY=${GROK_API_KEY}
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
    depends_on:
      postgres_test:
        condition: service_healthy
    command: ["/usr/local/bin/python", "-m", "pytest", "-q"]
    profiles:
      - test

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
      - HOSTNAME=0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  backend_logs: